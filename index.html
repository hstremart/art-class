<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1학년 미술 수업실</title>
<meta name="description" content="중학교 1학년 미술 수업 콘텐츠 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ec; --surface:#fffdf9; --surface-2:#f1ebe1; --ink:#2a2420; --ink-2:#5e554d; --line:#e2d9cc;
  --a-감상:#2f6690; --a-표현:#c4553a; --a-체험:#3f7d4e;
  --radius:16px; --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1917; --surface:#24211e; --surface-2:#2d2925; --ink:#efe8df; --ink-2:#b5aba0; --line:#3a352f;
    --a-감상:#7fb2dc; --a-표현:#ec8a70; --a-체험:#86c294; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1917; --surface:#24211e; --surface-2:#2d2925; --ink:#efe8df; --ink-2:#b5aba0; --line:#3a352f;
  --a-감상:#7fb2dc; --a-표현:#ec8a70; --a-체험:#86c294; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
h1,h2,h3{font-family:"Gowun Batang",serif;line-height:1.3;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:56px 0 24px}
header .k{color:var(--ink-2);margin:0 0 6px}
header h1{font-size:clamp(32px,6vw,52px)}
header p.lead{color:var(--ink-2);font-size:18px;margin:12px 0 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0 20px}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button:focus-visible,.card:focus-visible{outline:3px solid var(--a-감상);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;padding-bottom:56px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .thumb{aspect-ratio:16/10;background:var(--surface-2);position:relative;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.card .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:"Gowun Batang",serif;font-size:28px;color:var(--ink-2);background:repeating-linear-gradient(135deg,var(--surface-2) 0 12px,var(--surface) 12px 24px)}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.tag{padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.tag.area{color:var(--c);border-color:var(--c);font-weight:700}
.card h3{font-size:21px;margin-top:2px}
.card p{margin:0;color:var(--ink-2);font-size:15px}
.card .go{margin-top:auto;padding-top:8px;font-weight:700;font-size:14px;color:var(--c)}
.card.soon{opacity:.65}
.card.soon .go{color:var(--ink-2);font-weight:400}
.empty{color:var(--ink-2);padding:40px 0}
footer{border-top:1px solid var(--line);padding:20px 0 40px;color:var(--ink-2);font-size:13px}
</style>
</head>
<body>
<header class="wrap">
  <p class="k">중학교 1학년 미술</p>
  <h1>미술 수업실</h1>
  <p class="lead">오늘 수업을 골라 들어가세요.</p>
</header>

<main class="wrap">
  <div class="filters" role="group" aria-label="영역별 보기" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">각 수업에서 쓴 글은 내 기기의 브라우저에만 저장돼요.</div></footer>

<script src="lessons.js"></script>
<script>
(function(){
  const L=window.LESSONS||[];
  const grid=document.getElementById('grid'), fl=document.getElementById('filters');
  const areas=['전체',...new Set(L.map(x=>x.area))];
  const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let cur='전체';
  try{const s=sessionStorage.getItem('art-class-filter');if(areas.includes(s))cur=s}catch(e){}

  function render(){
    fl.innerHTML=areas.map(a=>'<button aria-pressed="'+(a===cur)+'" data-a="'+esc(a)+'">'+esc(a)+'</button>').join('');
    const list=L.filter(x=>cur==='전체'||x.area===cur).sort((a,b)=>(b.ready===true)-(a.ready===true));
    grid.innerHTML=list.length?list.map(x=>{
      const c='var(--a-'+x.area+', var(--ink))';
      const thumb=x.thumb?'<img src="'+esc(x.thumb)+'" alt="" loading="lazy">':'<div class="ph">'+esc(x.unit)+'</div>';
      const inner='<div class="thumb">'+thumb+'</div><div class="body">'+
        '<div class="tags"><span class="tag area">'+esc(x.area)+'</span><span class="tag">'+esc(x.unit)+'</span><span class="tag">'+esc(x.period)+'</span></div>'+
        '<h3>'+esc(x.title)+'</h3><p>'+esc(x.summary)+'</p>'+
        '<div class="go">'+(x.ready?'수업 시작 →':'준비 중')+'</div></div>';
      return x.ready
        ? '<a class="card" style="--c:'+c+'" href="lessons/'+encodeURIComponent(x.id)+'/">'+inner+'</a>'
        : '<div class="card soon" style="--c:'+c+'" aria-disabled="true">'+inner+'</div>';
    }).join(''):'<p class="empty">이 영역의 수업이 아직 없어요.</p>';
  }
  fl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.a;try{sessionStorage.setItem('art-class-filter',cur)}catch(e){}render()});
  render();
})();
</script>
</body>
</html>
